name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Κλειδί υπογραφής
        env:
          KS_PASS: ${{ secrets.KS_PASS }}
        run: |
          if [ -n "$KS_PASS" ]; then
            openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 \
              -in keystore/thermides.p12.enc -out keystore/thermides.p12 -pass env:KS_PASS
            echo "SIGNED=1" >> "$GITHUB_ENV"
          else
            echo "::warning title=Υπογραφή::Λείπει το secret KS_PASS - το APK υπογράφεται με προσωρινό κλειδί και ΔΕΝ θα μπορεί να ενημερώσει προηγούμενη εγκατάσταση."
          fi

      - name: Δοκιμές + APK
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew testDebugUnitTest assembleRelease --no-daemon --stacktrace \
            -PversionCode=${{ github.run_number }} 2>&1 | tee build.log

      - name: Σφάλματα build ως σημείωση
        if: failure()
        run: |
          MSG=$(grep -E "^e: |error:|FAILED|What went wrong|^> |Unresolved|Could not|AAPT|Exception" build.log | head -80 || true)
          [ -z "$MSG" ] && MSG=$(tail -60 build.log)
          MSG="${MSG//'%'/'%25'}"; MSG="${MSG//$'\n'/'%0A'}"; MSG="${MSG//$'\r'/'%0D'}"
          echo "::error title=Build log::$MSG"

      - name: Όνομα αρχείου
        run: cp app/build/outputs/apk/release/app-release.apk thermides.apk

      - uses: actions/upload-artifact@v4
        with:
          name: thermides-apk
          path: thermides.apk

      - name: Δημοσίευση (releases/latest)
        if: github.ref == 'refs/heads/main' && env.SIGNED == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --cleanup-tag -y || true
          gh release create latest thermides.apk \
            --target "$GITHUB_SHA" \
            --title "Θερμίδες 1.0.${{ github.run_number }}" \
            --notes "Αυτόματο build #${{ github.run_number }} από το commit ${GITHUB_SHA::7}."
